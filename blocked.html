<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Blocked by GameGuard</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: radial-gradient(circle at 30% 20%, #1e1b4b 0, #0b1120 55%); }
      .wrap { width: 100%; max-width: 440px; text-align: center; }
      .shield { font-size: 64px; }
      .card { text-align: left; margin-top: 22px; }
      code { background: #1e293b; padding: 2px 8px; border-radius: 6px; color: #fca5a5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="shield">🛡️</div>
      <h1>This game is blocked</h1>
      <p class="muted"><code id="domain">this site</code> is a 3D game site and has been blocked by your administrator.</p>
      <div class="card">
        <strong>Have the admin password?</strong>
        <form id="form">
          <label for="pw">Admin password</label>
          <input id="pw" type="password" required autofocus />
          <label for="min">Unlock for</label>
          <select id="min">
            <option value="15">15 minutes</option>
            <option value="30" selected>30 minutes</option>
            <option value="60">1 hour</option>
            <option value="120">2 hours</option>
            <option value="240">4 hours</option>
            <option value="480">8 hours</option>
          </select>
          <button type="submit">Unlock games</button>
          <div id="err" class="err"></div>
        </form>
      </div>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
